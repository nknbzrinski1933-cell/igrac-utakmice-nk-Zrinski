<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Igrač utakmice – NK Zrinski</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f3f3;color:#111}
header{background:#111;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:19px;margin:0}.wrap{max-width:1000px;margin:auto;padding:18px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:16px}
button{border:0;border-radius:9px;padding:11px 15px;background:#111;color:#fff;font-weight:700;cursor:pointer}
button.gray{background:#eee;color:#111}button.red{background:#a00}
input,select{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;margin:5px 0 12px;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.player{background:#fff;border:1px solid #ddd;border-radius:12px;padding:15px}.player h3{margin:6px 0}
.vote{width:100%;margin-top:10px}.disabled{opacity:.45;pointer-events:none}
.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font-size:12px;font-weight:bold}
.open{background:#dff0df}.wait{background:#fff0bd}.closed{background:#f5d5d5}
.row{padding:10px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#666}.hidden{display:none!important}
.bar{height:10px;background:#eee;border-radius:10px;overflow:hidden}.fill{height:100%;background:#111}
@media(max-width:700px){.grid{grid-template-columns:1fr}header{display:block}header button{margin-top:10px}}
</style>
</head>
<body>
<header>
<h1>⚽ Igrač utakmice – NK Zrinski</h1>
<div><button class="gray" id="publicBtn">Glasanje</button> <button class="gray" id="adminBtn">Admin</button></div>
</header>
<main class="wrap">
<section id="publicView">
<div class="card"><h2 id="matchTitle">Igrač utakmice</h2><div id="matchInfo" class="small">Učitavanje...</div><p id="voteStatus"></p><p id="voteMessage"></p></div>
<div id="players" class="players"></div><div id="results" class="card hidden"></div>
</section>
<section id="loginView" class="card hidden">
<h2>Admin prijava</h2><label>Email</label><input id="loginEmail" type="email"><label>Lozinka</label><input id="loginPassword" type="password">
<button id="loginBtn">Prijava</button><p id="loginMessage" class="small"></p>
</section>
<section id="adminView" class="hidden">
<div class="card"><h2>Admin panel</h2><p id="adminEmail" class="small"></p><button id="logoutBtn" class="gray">Odjava</button></div>
<div class="card"><h2>Nova utakmica</h2>
<div class="grid">
<div><label>Domaćin</label><input id="homeTeam" value="NK Zrinski NB"></div>
<div><label>Gost</label><input id="awayTeam"></div>
<div><label>Datum</label><input id="matchDate" type="date"></div>
<div><label>Status</label><select id="matchStatus"><option value="draft">Nacrt</option><option value="published">Objavljeno</option><option value="closed">Zatvoreno</option></select></div>
<div><label>Otvaranje glasanja</label><input id="openTime" type="datetime-local"></div>
<div><label>Zatvaranje glasanja</label><input id="closeTime" type="datetime-local"></div>
</div>
<label><input id="resultsAfter" type="checkbox" checked style="width:auto"> Rezultati tek nakon zatvaranja</label><br><br>
<button id="saveMatchBtn">Spremi utakmicu</button><p id="adminMessage" class="small"></p>
</div>
<div class="card"><h2>Utakmice</h2><div id="matchList">Učitavanje...</div></div>
<div id="manageView" class="card hidden"><h2>Igrači</h2><p id="selectedMatch" class="small"></p>
<div class="grid"><div><label>Ime i prezime</label><input id="playerName"></div><div><label>Broj dresa</label><input id="playerNumber" type="number" min="1" max="99"></div></div>
<button id="addPlayerBtn">Dodaj igrača</button><div id="playerList"></div></div>
</section>
</main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://srfniisyvjohlrngpnee.supabase.co";
const SUPABASE_KEY="sb_publishable_jBq7SSHdgejzCAJv3jhreQ_CCUK6Lhs";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let selectedMatch=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const matchId=()=>new URLSearchParams(location.search).get("match");

function deviceToken(){
 let t=localStorage.getItem("zrinski_device_token");
 if(!t){t=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random())+"-"+Date.now();localStorage.setItem("zrinski_device_token",t)}
 return t;
}
function publicMode(){$("publicView").classList.remove("hidden");$("loginView").classList.add("hidden");$("adminView").classList.add("hidden");loadPublic()}
async function adminMode(){
 $("publicView").classList.add("hidden");
 const session=(await sb.auth.getSession()).data.session;
 if(session){$("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");$("adminEmail").textContent="Prijavljen: "+session.user.email;loadMatches()}
 else{$("loginView").classList.remove("hidden");$("adminView").classList.add("hidden")}
}
async function login(){
 $("loginMessage").textContent="Prijava...";
 const r=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});
 if(r.error){$("loginMessage").textContent="Greška: "+r.error.message;return}
 $("loginView").classList.add("hidden");$("adminView").classList.remove("hidden");$("adminEmail").textContent="Prijavljen: "+r.data.user.email;loadMatches()
}
async function logout(){await sb.auth.signOut();publicMode()}
function matchId(){
    return new URLSearchParams(location.search).get("match");
}

async function findActiveMatch(){

    const direct=matchId();

    // Ako je otvoren link ?match=neki-id
    if(direct) return direct;

    const {data,error}=await sb
        .from("matches")
        .select("id,voting_opens_at,voting_closes_at,match_date")
        .eq("status","published")
        .order("match_date",{ascending:false});

    if(error || !data || data.length===0)
        return null;

    const now=Date.now();

    // Trenutno otvoreno glasanje
    const active=data.find(m=>{
        const open=new Date(m.voting_opens_at).getTime();
        const close=new Date(m.voting_closes_at).getTime();

        return now>=open && now<close;
    });

    if(active)
        return active.id;

    // Ako trenutno nema glasanja,
    // pronađi sljedeće
    const next=data
        .filter(m =>
            new Date(m.voting_opens_at).getTime()>now
        )
        .sort((a,b)=>
            new Date(a.voting_opens_at)-new Date(b.voting_opens_at)
        )[0];

    return next ? next.id : null;
}
 async function loadPublic(){
 const id=await findActiveMatch();
 if(!id){$("matchTitle").textContent="Igrač utakmice";$("matchInfo").textContent="QR kod utakmice otvorit će glasanje.";$("players").innerHTML="";return}
 const r=await sb.from("matches").select("*").eq("id",id).eq("status","published").maybeSingle();
 if(r.error||!r.data){$("matchTitle").textContent="Utakmica nije pronađena";$("matchInfo").textContent="Provjeri poveznicu.";$("players").innerHTML="";return}
 selectedMatch=r.data;$("matchTitle").textContent=r.data.home_team+" — "+r.data.away_team;$("matchInfo").textContent="Datum: "+new Date(r.data.match_date+"T12:00:00").toLocaleDateString("hr-HR");
 const now=Date.now(),open=new Date(r.data.voting_opens_at).getTime(),close=new Date(r.data.voting_closes_at).getTime();
 const state=now<open?"wait":now>=close?"closed":"open";
 $("voteStatus").innerHTML=state==="open"?'<span class="status open">GLASANJE OTVORENO</span>':state==="wait"?'<span class="status wait">GLASANJE JOŠ NIJE OTVORENO</span>':'<span class="status closed">GLASANJE ZATVORENO</span>';
 $("voteMessage").textContent=state==="open"?"Odaberi jednog igrača.":state==="wait"?"Glasanje još nije počelo.":"Glasanje je završeno.";
 const p=await sb.from("players").select("*").eq("match_id",id).order("shirt_number",{ascending:true});
 const voted=localStorage.getItem("voted_"+id)==="1";
 $("players").innerHTML=(p.data||[]).map(x=>'<div class="player"><div class="small">BROJ '+esc(x.shirt_number||"—")+'</div><h3>'+esc(x.name)+'</h3><button class="vote '+(state!=="open"||voted?"disabled":"")+'" data-player="'+x.id+'">'+(voted?"GLAS VEĆ ZABILJEŽEN":"GLASAJ")+'</button></div>').join("");
 document.querySelectorAll("[data-player]").forEach(b=>b.addEventListener("click",()=>vote(b.dataset.player)));
 if(state==="closed"&&r.data.show_results_after_close)loadResults(id);else $("results").classList.add("hidden")
}
async function vote(playerId){
 if(!selectedMatch)return;
 const r=await sb.rpc("submit_vote",{p_match_id:selectedMatch.id,p_player_id:playerId,p_device_hash:deviceToken()});
 if(r.error){alert("Greška pri slanju glasa: "+r.error.message);return}
 if(r.data&&r.data.success){localStorage.setItem("voted_"+selectedMatch.id,"1");alert("Hvala! Vaš glas je zabilježen.");loadPublic()}
 else alert((r.data&&r.data.message)||"Glas nije zaprimljen.")
}
async function loadResults(id){
 const r=await sb.rpc("get_match_results",{p_match_id:id});if(r.error)return;
 const rows=r.data||[],total=rows.reduce((a,x)=>a+Number(x.vote_count),0);
 $("results").classList.remove("hidden");$("results").innerHTML="<h2>Rezultati</h2>"+rows.map(x=>{const pct=total?Math.round(Number(x.vote_count)*100/total):0;return '<div class="row"><b>'+esc(x.player_name)+'</b> — '+x.vote_count+' glasova ('+pct+'%)<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div></div>'}).join("")+"<p class='small'>Ukupno glasova: "+total+"</p>"
}
async function loadMatches(){
 const r=await sb.from("matches").select("*").order("match_date",{ascending:false});
 if(r.error){$("matchList").textContent="Greška: "+r.error.message;return}
 $("matchList").innerHTML=(r.data||[]).map(m=>'<div class="row"><b>'+esc(m.home_team)+' — '+esc(m.away_team)+'</b><br><span class="small">'+esc(m.match_date)+' • '+esc(m.status)+'</span><br><button class="manageBtn" data-id="'+m.id+'">Upravljaj igračima</button></div>').join("")||"Nema utakmica.";
 document.querySelectorAll(".manageBtn").forEach(b=>b.addEventListener("click",()=>manageMatch(b.dataset.id)))
}
async function saveMatch(){
 const home=$("homeTeam").value.trim(),away=$("awayTeam").value.trim();
 if(!home||!away||!$("matchDate").value||!$("openTime").value||!$("closeTime").value){$("adminMessage").textContent="Popuni sva polja.";return}
 if(new Date($("closeTime").value)<=new Date($("openTime").value)){$("adminMessage").textContent="Vrijeme zatvaranja mora biti nakon otvaranja.";return}
 const r=await sb.from("matches").insert({home_team:home,away_team:away,match_date:$("matchDate").value,voting_opens_at:new Date($("openTime").value).toISOString(),voting_closes_at:new Date($("closeTime").value).toISOString(),status:$("matchStatus").value,show_results_after_close:$("resultsAfter").checked}).select().single();
 if(r.error){$("adminMessage").textContent="Greška: "+r.error.message;return}
 $("adminMessage").textContent="Utakmica spremljena.";loadMatches();manageMatch(r.data.id)
}
async function manageMatch(id){
 const r=await sb.from("matches").select("*").eq("id",id).single();if(r.error){alert(r.error.message);return}
 selectedMatch=r.data;$("manageView").classList.remove("hidden");$("selectedMatch").textContent=r.data.home_team+" — "+r.data.away_team+" | "+r.data.match_date;
 const p=await sb.from("players").select("*").eq("match_id",id).order("shirt_number",{ascending:true});
 $("playerList").innerHTML=(p.data||[]).map(x=>'<div class="row"><b>#'+esc(x.shirt_number||"—")+' '+esc(x.name)+'</b> <button class="red deleteBtn" data-id="'+x.id+'">Obriši</button></div>').join("")||"Nema igrača.";
 document.querySelectorAll(".deleteBtn").forEach(b=>b.addEventListener("click",()=>deletePlayer(b.dataset.id,id)))
}
async function addPlayer(){
 if(!selectedMatch)return;const name=$("playerName").value.trim();if(!name){alert("Unesi ime igrača.");return}
 const r=await sb.from("players").insert({match_id:selectedMatch.id,name:name,shirt_number:Number($("playerNumber").value)||null});
 if(r.error){alert("Greška: "+r.error.message);return}$("playerName").value="";$("playerNumber").value="";manageMatch(selectedMatch.id)
}
async function deletePlayer(pid,mid){if(!confirm("Obrisati igrača?"))return;const r=await sb.from("players").delete().eq("id",pid);if(r.error)alert(r.error.message);else manageMatch(mid)}
$("publicBtn").addEventListener("click",publicMode);$("adminBtn").addEventListener("click",adminMode);$("loginBtn").addEventListener("click",login);$("logoutBtn").addEventListener("click",logout);$("saveMatchBtn").addEventListener("click",saveMatch);$("addPlayerBtn").addEventListener("click",addPlayer);
publicMode();
})();
</script>
</body>
</html>
