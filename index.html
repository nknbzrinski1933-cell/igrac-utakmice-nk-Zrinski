 <!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NK Zrinski - Igrač utakmice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
    --red:#e30613;
    --red-dark:#a9040d;
    --blue:#1238e8;
    --dark:#05070d;
    --card:#111827;
    --card2:#0b111d;
    --line:#273247;
    --muted:#aab4c5;
    --white:#ffffff;
    --green:#087a3d;
    --yellow:#8a6b00;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            #142b8a55,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            #e3061320,
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #05070d,
            #111827
        );

    color:var(--white);
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    border-radius:12px;
    padding:13px 17px;
    font-weight:800;
    cursor:pointer;
    color:white;
    background:var(--red);
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
    filter:brightness(1.08);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}

.container{
    width:100%;
    max-width:780px;
    margin:auto;
    padding:18px 14px 60px;
}


/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    padding:10px 0 5px;
}

.logo{
    width:105px;
    height:105px;
    object-fit:contain;
    background:white;
    border-radius:24px;
    padding:5px;

    box-shadow:
        0 0 35px #1238e855;

    display:inline-block;
}

.header h1{
    margin:12px 0 3px;
    font-size:30px;
    font-weight:900;
    letter-spacing:.5px;
}

.header-sub{
    color:var(--muted);
    font-size:14px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:15px;
}

.nav button{
    background:#202a3d;
}

.nav button.active{
    background:var(--blue);
}


/* =========================
   CARDS
========================= */

.card{
    background:rgba(17,24,39,.96);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-top:16px;

    box-shadow:
        0 15px 40px #0006;
}

.card h2{
    margin-top:0;
}


/* =========================
   MATCH
========================= */

.match-title{
    font-size:29px;
    font-weight:900;
    text-align:center;
}

.match-info{
    text-align:center;
    color:var(--muted);
    margin-top:7px;
}


/* =========================
   STATUS
========================= */

.status{
    text-align:center;
    font-weight:900;
    padding:12px;
    border-radius:12px;
    margin-top:18px;
}

.status.open{
    background:var(--green);
}

.status.wait{
    background:var(--yellow);
}

.status.closed{
    background:#7a2029;
}


/* =========================
   TIMER
========================= */

.timer{
    text-align:center;
    margin:20px 0 14px;
}

.timer-label{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.timer-value{
    font-size:43px;
    font-weight:900;
    margin-top:5px;
    letter-spacing:2px;
}

.timer.closed-timer{
    color:#ff5c68;
}


/* =========================
   NOTICE
========================= */

.notice{
    padding:13px;
    border-radius:11px;
    background:#182132;
    color:#d9e0ec;
    margin-top:10px;
    line-height:1.45;
}


/* =========================
   PLAYERS
========================= */

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    padding:15px;
    margin:10px 0;

    border:1px solid var(--line);
    border-radius:15px;

    background:var(--card2);
}

.player-name{
    font-size:18px;
    font-weight:800;
}

.player-number{
    color:var(--muted);
    font-size:12px;
    margin-bottom:4px;
}

.player button{
    min-width:105px;
}


/* =========================
   RESULTS
========================= */

.results-header{
    text-align:center;
    margin-bottom:15px;
}

.results-header h2{
    margin-bottom:5px;
}

.results-subtitle{
    color:var(--muted);
    font-size:13px;
}

.result-row{
    padding:14px 0;
    border-bottom:1px solid var(--line);
}

.result-row:last-child{
    border-bottom:0;
}

.result-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.result-name{
    font-weight:800;
}

.result-votes{
    font-weight:900;
}

.bar{
    height:9px;
    background:#283246;
    border-radius:9px;
    overflow:hidden;
    margin-top:8px;
}

.fill{
    height:100%;
    background:
        linear-gradient(
            90deg,
            var(--red),
            var(--blue)
        );
    border-radius:9px;
    transition:width .5s;
}

.total-votes{
    text-align:center;
    color:var(--muted);
    margin-top:15px;
    font-size:13px;
}


/* =========================
   FORMS
========================= */

label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

input,
select{
    width:100%;
    padding:12px;
    margin:6px 0 12px;

    border-radius:10px;
    border:1px solid var(--line);

    background:#090e18;
    color:white;
}

input:focus,
select:focus{
    outline:2px solid #1238e866;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}


/* =========================
   ADMIN
========================= */

.admin-match{
    padding:14px 0;
    border-bottom:1px solid var(--line);
}

.admin-match:last-child{
    border-bottom:0;
}

.admin-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.admin-link{
    margin-top:10px;
    padding:12px;
    background:#090e18;
    border:1px solid var(--line);
    border-radius:10px;
    word-break:break-all;
    font-size:12px;
    color:#d9e0ec;
}

.red-button{
    background:var(--red-dark);
}

.blue-button{
    background:var(--blue);
}

.gray-button{
    background:#273247;
}


/* =========================
   HELPERS
========================= */

.hidden{
    display:none !important;
}

.small{
    color:var(--muted);
    font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

    .container{
        padding:15px 12px 45px;
    }

    .logo{
        width:90px;
        height:90px;
    }

    .header h1{
        font-size:25px;
    }

    .match-title{
        font-size:23px;
    }

    .timer-value{
        font-size:32px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .player{
        flex-direction:column;
        align-items:stretch;
    }

    .player button{
        width:100%;
    }

    .result-top{
        align-items:flex-start;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <img
        src="logo.png"
        class="logo"
        alt="NK Zrinski logo"
        onerror="this.style.display='none'"
    >

    <h1>IGRAČ UTAKMICE</h1>

    <div class="header-sub">
        NK Zrinski Nova Bukovica
    </div>

    <div class="nav">

        <button
            id="publicBtn"
            class="active"
        >
            GLASANJE
        </button>

        <button
            id="adminBtn"

            ADMIN

</header>



<!-- =====================================================
     JAVNO GLASANJE
===================================================== -->

<section id="publicView">

    <div class="card">

        <div
            id="matchTitle"
            class="match-title"
        >
            Učitavanje utakmice...
        </div>


        <div
            id="matchInfo"
            class="match-info"
        >
            Učitavanje...
        </div>


        <div
            id="voteStatus"
            class="status wait"
        >
            UČITAVANJE
        </div>


        <!-- TIMER -->

        <div class="timer">

            <div
                id="timerLabel"
                class="timer-label"
            >
                Vrijeme
            </div>

            <div
                id="timer"
                class="timer-value"

                --:--:--
            </div>

        >

<!-- =====================================================

<section

    <h2>Admin prijava</h2>

        id="email"
        type="email"

<!-- =====================================================
     ADMIN
===================================================== -->

<section
    id="adminView"
    class="hidden"
>


    <!-- NOVA UTAKMICA -->

    <div class="card">

        <h2>Nova utakmica</h2>


        <div class="grid">

            <div>

                <label>Domaći</label>

                <input
                    id="homeTeam"
                    value="NK Zrinski"
                >

            </div>


            <div>

                <label>Gosti</label>

        <label>Datum utakmice</label>

            id="matchDate"

        <div class="grid">

            <div>

                <label>Otvaranje glasanja</label>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://srfniisyvjohlrngpnee.supabase.co";


const SUPABASE_KEY =
"sb_publishable_jBq7SSHdgejzCAJv3jhreQ_CCUK6Lhs";


const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================================
   GLOBALNE VARIJABLE
===================================================== */

let selectedMatch = null;

let timerInterval = null;



/* =====================================================
   POMOĆNE FUNKCIJE
===================================================== */

function $(id){

    return document.getElementById(id);

}


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g,function(char){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[char];

        });

}



/* =====================================================
   ID UTAKMICE IZ LINKA
===================================================== */

function matchId(){

    return new URLSearchParams(
        window.location.search
    ).get("match");

}



/* =====================================================
   UREĐAJ
===================================================== */

function deviceToken(){

    let token =
        localStorage.getItem(
            "zrinski_device_token"
        );


    if(!token){

        if(
            window.crypto &&
            window.crypto.randomUUID
        ){

            token =
                window.crypto.randomUUID();

        }else{

            token =
                Math.random()
                .toString(36)
                .substring(2)
                +
                Date.now();

        }


        localStorage.setItem(
            "zrinski_device_token",
            token
        );

    }


    return token;

}



/* =====================================================
   PRONAĐI UTAKMICU
===================================================== */

async function findActiveMatch(){

    /*
       Ako netko otvori:

       https://igrac-utakmice-nk-zrinski.vercel.app/?match=ID

       koristimo baš tu utakmicu.
    */

    const direct =
        matchId();


    if(direct){

        return direct;

    }


    /*
       Ako nema ID-a,
       pronađi trenutno otvorenu utakmicu.
    */

    const result =
        await sb
        .from("matches")
        .select(
            "id,voting_opens_at,voting_closes_at,match_date"
        )
        .eq(
            "status",
            "published"
        )
        .order(
            "match_date",
            {
                ascending:false
            }
        );


    if(
        result.error ||
        !result.data ||
        result.data.length === 0
    ){

        return null;

    }


    const now =
        Date.now();


    /*
       Trenutno otvorena.
    */

    const active =
        result.data.find(function(match){

            const open =
                new Date(
                    match.voting_opens_at
                ).getTime();


            const close =
                new Date(
                    match.voting_closes_at
                ).getTime();


            return (
                now >= open &&
                now < close
            );

        });


    if(active){

        return active.id;

    }


    /*
       Ako nije otvorena,
       pronađi sljedeću.
    */

    const next =
        result.data
        .filter(function(match){

            return (
                new Date(
                    match.voting_opens_at
                ).getTime()
                > now
            );

        })
        .sort(function(a,b){

            return (
                new Date(a.voting_opens_at)
                -
                new Date(b.voting_opens_at)
            );

        })[0];


    return next
        ? next.id
        : null;

}



/* =====================================================
   TIMER FORMAT
===================================================== */

function formatTime(ms){

    let seconds =
        Math.max(
            0,
            Math.floor(ms / 1000)
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds =
        seconds % 3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds =
        seconds % 60;


    return (
        String(hours).padStart(2,"0")
        +
        ":"
        +
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(seconds).padStart(2,"0")
    );

}



/* =====================================================
   TIMER
===================================================== */

function startTimer(
    openTime,
    closeTime,
    state
){

    clearInterval(
        timerInterval
    );


    function update(){

        const now =
            Date.now();


        let remaining;


        if(state === "wait"){

            remaining =
                openTime - now;


            $("timerLabel").textContent =
                "GLASANJE SE OTVARA ZA";

        }else{

            remaining =
                closeTime - now;


            $("timerLabel").textContent =
                "GLASANJE SE ZATVARA ZA";

        }


        if(remaining <= 0){

            clearInterval(
                timerInterval
            );


            loadPublic();

            return;

        }


        $("timer").textContent =
            formatTime(remaining);

    }


    update();


    timerInterval =
        setInterval(
            update,
            1000
        );

}



/* =====================================================
   JAVNO GLASANJE
===================================================== */

async function loadPublic(){

    clearInterval(
        timerInterval
    );


    const id =
        await findActiveMatch();


    if(!id){

        $("matchTitle").textContent =
            "Nema aktivnog glasanja";


        $("matchInfo").textContent =
            "Trenutno nema objavljene utakmice.";


        $("voteStatus").className =
            "status closed";


        $("voteStatus").textContent =
            "NEMA GLASANJA";


        $("voteMessage").textContent =
            "Admin još nije otvorio glasanje.";


        $("timerLabel").textContent =
            "VRIJEME";


        $("timer").textContent =
            "--:--:--";


        $("players").innerHTML =
            "";


        $("results").classList.add(
            "hidden"
        );


        return;

    }



    const matchResult =
        await sb
        .from("matches")
        .select("*")
        .eq("id",id)
        .eq("status","published")
        .maybeSingle();


    if(
        matchResult.error ||
        !matchResult.data
    ){

        $("matchTitle").textContent =
            "Utakmica nije pronađena";


        $("matchInfo").textContent =
            "Provjeri poveznicu.";


        $("players").innerHTML =
            "";


        $("results").classList.add(
            "hidden"
        );


        return;

    }


    selectedMatch =
        matchResult.data;



    /* UTAKMICA */

    $("matchTitle").textContent =
        matchResult.data.home_team
        +
        " — "
        +
        matchResult.data.away_team;


    $("matchInfo").textContent =
        "Datum: "
        +
        new Date(
            matchResult.data.match_date
            +
            "T12:00:00"
        ).toLocaleDateString(
            "hr-HR"
        );



    /* VREMENA */

    const now =
        Date.now();


    const openTime =
        new Date(
            matchResult.data.voting_opens_at
        ).getTime();


    const closeTime =
        new Date(
            matchResult.data.voting_closes_at
        ).getTime();



    let state;


    if(now < openTime){

        state = "wait";

    }else if(now >= closeTime){

        state = "closed";

    }else{

        state = "open";

    }



    /* =================================================
       STATUS
    ================================================= */

    $("voteStatus").className =
        "status "
        +
        state;


    if(state === "open"){

        $("voteStatus").textContent =
            "GLASANJE OTVORENO";


        $("voteMessage").textContent =
            "Odaberi jednog igrača. Svaki uređaj može glasati jednom.";

    }


    if(state === "wait"){

        $("voteStatus").textContent =
            "GLASANJE JOŠ NIJE OTVORENO";


        $("voteMessage").textContent =
            "Glasanje će se automatski otvoriti u zadano vrijeme.";

    }


    if(state === "closed"){

        $("voteStatus").textContent =
            "GLASANJE ZATVORENO";


        $("voteMessage").textContent =
            "Glasanje je završeno. Rezultati su dostupni 24 sata.";

    }



    /* =================================================
       TIMER
    ================================================= */

    if(state !== "closed"){

        startTimer(
            openTime,
            closeTime,
            state
        );

    }else{

        $("timerLabel").textContent =
            "GLASANJE JE ZATVORENO";


        $("timer").textContent =
            "00:00:00";


        $("timer").classList.add(
            "closed-timer"
        );

    }



    /* =================================================
       IGRAČI
    ================================================= */

    const playersResult =
        await sb
        .from("players")
        .select("*")
        .eq(
            "match_id",
            id
        )
        .order(
            "shirt_number",
            {
                ascending:true
            }
        );


    if(playersResult.error){

        $("players").innerHTML =
            "<div class='notice'>Greška pri učitavanju igrača.</div>";

    }else{

        const alreadyVoted =
            localStorage.getItem(
                "voted_" + id
            ) === "1";


        if(
            !playersResult.data ||
            playersResult.data.length === 0
        ){

            $("players").innerHTML =
                "<div class='notice'>Igrači još nisu uneseni.</div>";

        }else{

            $("players").innerHTML =
                playersResult.data
                .map(function(player){

                    const disabled =
                        state !== "open"
                        ||
                        alreadyVoted;


                    const buttonText =
                        alreadyVoted
                        ?
                        "GLAS VEĆ ZABILJEŽEN"
                        :
                        state === "closed"
                        ?
                        "GLASANJE ZATVORENO"
                        :
                        "GLASAJ";


                    return `

                    <div class="player">

                        <div>

                            <div class="player-number">
                                BROJ
                                ${esc(
                                    player.shirt_number || "—"
                                )}
                            </div>

                            <div class="player-name">
                                ${esc(player.name)}
                            </div>

                        </div>

                        <button
                            data-player="${player.id}"
                            ${disabled ? "disabled" : ""}
                        >
                            ${buttonText}
                        </button>

                    </div>

                    `;

                })
                .join("");


            document
            .querySelectorAll(
                "[data-player]"
            )
            .forEach(function(button){

                button.addEventListener(
                    "click",
                    function(){

                        vote(
                            button.dataset.player
                        );

                    }
                );

            });

        }

    }



    /* =================================================
       REZULTATI — 24 SATA
    ================================================= */

    if(state === "closed"){

        const closedAt =
            closeTime;


        const twentyFourHours =
            24 * 60 * 60 * 1000;


        const resultsExpireAt =
            closedAt +
            twentyFourHours;


        /*
           Rezultati se prikazuju samo
           prvih 24 sata nakon zatvaranja.
        */

        if(
            Date.now() <
            resultsExpireAt
        ){

            await loadResults(id);

        }else{

            $("results").classList.add(
                "hidden"
            );

        }

    }else{

        $("results").classList.add(
            "hidden"
        );

    }

}



/* =====================================================
   GLASANJE
===================================================== */

async function vote(
    playerId
){

    if(!selectedMatch){

        return;

    }


    /*
       Dodatna provjera u browseru.
    */

    if(
        localStorage.getItem(
            "voted_" +
            selectedMatch.id
        ) === "1"
    ){

        alert(
            "Već ste glasali na ovoj utakmici."
        );

        return;

    }


    const result =
        await sb.rpc(
            "submit_vote",
            {
                p_match_id:
                    selectedMatch.id,

                p_player_id:
                    playerId,

                p_device_hash:
                    deviceToken()
            }
        );


    if(result.error){

        alert(
            "Greška pri slanju glasa: "
            +
            result.error.message
        );


        return;

    }


    if(
        result.data &&
        result.data.success
    ){

        localStorage.setItem(
            "voted_" +
            selectedMatch.id,
            "1"
        );


        alert(
            "Hvala! Vaš glas je zabilježen."
        );


        await loadPublic();


    }else{

        alert(
            result.data &&
            result.data.message
            ?
            result.data.message
            :
            "Glas nije zaprimljen."
        );

    }

}



/* =====================================================
   REZULTATI
===================================================== */

async function loadResults(
    id
){

    const result =
        await sb.rpc(
            "get_match_results",
            {
                p_match_id:id
            }
        );


    if(result.error){

        $("results").innerHTML =
            "<div class='notice'>Rezultati trenutno nisu dostupni.</div>";

        $("results").classList.remove(
            "hidden"
        );

        return;

    }


    const rows =
        result.data || [];


    const total =
        rows.reduce(
            function(sum,row){

                return (
                    sum +
                    Number(
                        row.vote_count || 0
                    )
                );

            },
            0
        );


    $("results").classList.remove(
        "hidden"
    );


    let html = `

        <div class="results-header">

            <h2>
                🏆 REZULTATI GLASANJA
            </h2>

            <div class="results-subtitle">
                Rezultati su dostupni 24 sata nakon zatvaranja.
            </div>

        </div>

    `;


    if(rows.length === 0){

        html += `

            <div class="notice">
                Nema zaprimljenih glasova.
            </div>

        `;

    }else{

        rows.forEach(
            function(row){

                const votes =
                    Number(
                        row.vote_count || 0
                    );


                const percentage =
                    total > 0
                    ?
                    Math.round(
                        votes *
                        100 /
                        total
                    )
                    :
                    0;


                html += `

                <div class="result-row">

                    <div class="result-top">

                        <div class="result-name">

                            ${esc(
                                row.player_name
                            )}

                        </div>

                        <div class="result-votes">

                            ${votes}
                            ${votes === 1 ? "glas" : "glasova"}

                            (${percentage}%)

                        </div>

                    </div>


                    <div class="bar">

                        <div
                            class="fill"
                            style="width:${percentage}%"
                        ></div>

                    </div>

                </div>

                `;

            }
        );

    }


    html += `

        <div class="total-votes">

            Ukupno glasova:
            <strong>
                ${total}
            </strong>

        </div>

    `;


    $("results").innerHTML =
        html;

}



/* =====================================================
   ADMIN — UTAKMICE
===================================================== */

async function loadMatches(){

    const result =
        await sb
        .from("matches")
        .select("*")
        .order(
            "match_date",
            {
                ascending:false
            }
        );


    if(result.error){

        $("matchList").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        $("matchList").innerHTML =
            "<div class='notice'>Nema utakmica.</div>";


        return;

    }


    $("matchList").innerHTML =
        result.data
        .map(function(match){

            const link =
                window.location.origin
                +
                window.location.pathname
                +
                "?match="
                +
                match.id;


            return `

            <div class="admin-match">

                <b>

                    ${esc(match.home_team)}

                    —

                    ${esc(match.away_team)}

                </b>

                <br>


                <span class="small">

                    ${esc(match.match_date)}

                    •

                    ${esc(match.status)}

                </span>


                <div class="admin-actions">

                    <button
                        data-manage="${match.id}"
                        class="blue-button"
                    >
                        UPRAVLJAJ IGRAČIMA
                    </button>


                    <button
                        data-copy="${esc(link)}"
                        class="gray-button"
                    >
                        KOPIRAJ LINK
                    </button>

                </div>


                <div class="admin-link">

                    ${esc(link)}

                </div>

            </div>

            `;

        })
        .join("");


    /*
       Upravljanje igračima.
    */

    document
    .querySelectorAll(
        "[data-manage]"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                manageMatch(
                    button.dataset.manage
                );

            }
        );

    });


    /*
       Kopiranje direktnog linka.
    */

    document
    .querySelectorAll(
        "[data-copy]"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            async function(){

                const link =
                    button.dataset.copy;


                try{

                    await navigator.clipboard.writeText(
                        link
                    );


                    button.textContent =
                        "KOPIRANO ✓";


                    setTimeout(
                        function(){

                            button.textContent =
                                "KOPIRAJ LINK";

                        },
                        2000
                    );

                }catch(error){

                    prompt(
                        "Kopiraj ovaj link:",
                        link
                    );

                }

            }
        );

    });

}



/* =====================================================
   ADMIN — SPREMI UTAKMICU
===================================================== */

async function saveMatch(){

    const home =
        $("homeTeam")
        .value
        .trim();


    const away =
        $("awayTeam")
        .value
        .trim();


    const date =
        $("matchDate")
        .value;


    const open =
        $("openTime")
        .value;


    const close =
        $("closeTime")
        .value;


    if(
        !home ||
        !away ||
        !date ||
        !open ||
        !close
    ){

        $("adminMessage").textContent =
            "Popuni sva polja.";


        return;

    }


    if(
        new Date(close)
        <=
        new Date(open)
    ){

        $("adminMessage").textContent =
            "Vrijeme zatvaranja mora biti nakon otvaranja.";


        return;

    }


    const result =
        await sb
        .from("matches")
        .insert({

            home_team:
                home,

            away_team:
                away,

            match_date:
                date,

            voting_opens_at:
                new Date(open)
                .toISOString(),

            voting_closes_at:
                new Date(close)
                .toISOString(),

            status:
                $("matchStatus").value,

            show_results_after_close:
                true

        })
        .select()
        .single();


    if(result.error){

        $("adminMessage").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    $("adminMessage").textContent =
        "Utakmica uspješno spremljena.";


    await loadMatches();


    await manageMatch(
        result.data.id
    );

}



/* =====================================================
   ADMIN — IGRAČI
===================================================== */

async function manageMatch(
    id
){

    const result =
        await sb
        .from("matches")
        .select("*")
        .eq(
            "id",
            id
        )
        .single();


    if(result.error){

        alert(
            result.error.message
        );


        return;

    }


    selectedMatch =
        result.data;


    $("manageView")
        .classList
        .remove("hidden");


    $("selectedMatch").textContent =
        result.data.home_team
        +
        " — "
        +
        result.data.away_team
        +
        " | "
        +
        result.data.match_date;


    const playersResult =
        await sb
        .from("players")
        .select("*")
        .eq(
            "match_id",
            id
        )
        .order(
            "shirt_number",
            {
                ascending:true
            }
        );


    if(
        playersResult.error
    ){

        $("playerList").innerHTML =
            "<div class='notice'>Greška pri učitavanju igrača.</div>";


        return;

    }


    if(
        !playersResult.data ||
        playersResult.data.length === 0
    ){

        $("playerList").innerHTML =
            "<div class='notice'>Nema igrača.</div>";


        return;

    }


    $("playerList").innerHTML =
        playersResult.data
        .map(function(player){

            return `

            <div class="admin-match">

                <b>

                    #

                    ${esc(
                        player.shirt_number || "—"
                    )}

                    ${esc(
                        player.name
                    )}

                </b>


                <button
                    class="red-button"
                    data-delete="${player.id}"
                >
                    OBRIŠI
                </button>

            </div>

            `;

        })
        .join("");


    document
    .querySelectorAll(
        "[data-delete]"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                deletePlayer(
                    button.dataset.delete,
                    id
                );

            }
        );

    });

}



/* =====================================================
   DODAJ IGRAČA
===================================================== */

async function addPlayer(){

    if(!selectedMatch){

        return;

    }


    const name =
        $("playerName")
        .value
        .trim();


    const number =
        Number(
            $("playerNumber")
            .value
        )
        ||
        null;


    if(!name){

        alert(
            "Unesi ime igrača."
        );


        return;

    }


    const result =
        await sb
        .from("players")
        .insert({

            match_id:
                selectedMatch.id,

            name:
                name,

            shirt_number:
                number

        });


    if(result.error){

        alert(
            "Greška: "
            +
            result.error.message
        );


        return;

    }


    $("playerName").value =
        "";


    $("playerNumber").value =
        "";


    await manageMatch(
        selectedMatch.id
    );

}



/* =====================================================
   OBRIŠI IGRAČA
===================================================== */

async function deletePlayer(
    playerId,
    matchId
){

    if(
        !confirm(
            "Želiš li obrisati ovog igrača?"
        )
    ){

        return;

    }


    const result =
        await sb
        .from("players")
        .delete()
        .eq(
            "id",
            playerId
        );


    if(result.error){

        alert(
            result.error.message
        );


        return;

    }


    await manageMatch(
        matchId
    );

}



/* =====================================================
   JAVNI MODE
===================================================== */

function publicMode(){

    clearInterval(
        timerInterval
    );


    $("publicView")
        .classList
        .remove("hidden");


    $("loginView")
        .classList
        .add("hidden");


    $("adminView")
        .classList
        .add("hidden");


    $("publicBtn")
        .classList
        .add("active");


    $("adminBtn")
        .classList
        .remove("active");


    loadPublic();

}



/* =====================================================
   ADMIN MODE
===================================================== */

async function adminMode(){

    clearInterval(
        timerInterval
    );


    $("publicView")
        .classList
        .add("hidden");


    $("publicBtn")
        .classList
        .remove("active");


    $("adminBtn")
        .classList
        .add("active");


    const sessionResult =
        await sb.auth.getSession();


    if(
        sessionResult.data.session
    ){

        $("loginView")
            .classList
            .add("hidden");


        $("adminView")
            .classList
            .remove("hidden");


        await loadMatches();

    }else{

        $("loginView")
            .classList
            .remove("hidden");


        $("adminView")
            .classList
            .add("hidden");

    }

}



/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        $("email")
        .value
        .trim();


    const password =
        $("password")
        .value;


    if(!email || !password){

        $("loginMessage").textContent =
            "Unesi email i lozinku.";


        return;

    }


    const result =
        await sb.auth.signInWithPassword({

            email:
                email,

            password:
                password

        });


    if(result.error){

        $("loginMessage").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    $("loginMessage").textContent =
        "";


    $("loginView")
        .classList
        .add("hidden");


    $("adminView")
        .classList
        .remove("hidden");


    await loadMatches();

}



/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await sb.auth.signOut();


    publicMode();

}



/* =====================================================
   EVENT LISTENERS
===================================================== */

$("publicBtn")
    .addEventListener(
        "click",
        publicMode
    );


$("adminBtn")
    .addEventListener(
        "click",
        adminMode
    );


$("loginBtn")
    .addEventListener(
        "click",
        login
    );


$("logoutBtn")
    .addEventListener(
        "click",
        logout
    );


$("saveMatchBtn")
    .addEventListener(
        "click",
        saveMatch
    );


$("addPlayerBtn")
    .addEventListener(
        "click",
        addPlayer
    );



/* =====================================================
   START
===================================================== */

publicMode();

</script>
