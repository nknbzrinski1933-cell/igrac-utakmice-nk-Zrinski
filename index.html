<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NK Zrinski - Igrač utakmice</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--r:#e30613;--b:#1238e8;--c:#111827;--c2:#0b111d;--l:#273247;--m:#aab4c5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#05070d,#111827);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:18px 14px 60px}header{text-align:center}.logo{width:95px;height:95px;object-fit:contain;background:#fff;border-radius:22px;padding:5px}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:12px 15px;font-weight:800;color:#fff;background:var(--r)}button:disabled{opacity:.45}.nav{display:flex;justify-content:center;gap:8px;margin:15px}.nav button,.gray{background:#273247}.nav .active,.blue{background:var(--b)}.card{background:#111827f5;border:1px solid var(--l);border-radius:20px;padding:18px;margin-top:16px}.hidden{display:none!important}.muted{color:var(--m);font-size:13px}.notice{padding:12px;background:#182132;border-radius:11px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--m);font-size:13px}input,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--l);border-radius:10px;background:#090e18;color:#fff}.title{text-align:center;font-size:27px;font-weight:900}.center{text-align:center}.status{padding:11px;border-radius:11px;text-align:center;font-weight:900;margin:15px 0}.open{background:#087a3d}.wait{background:#8a6b00}.closed{background:#7a2029}.timer{text-align:center;font-size:35px;font-weight:900;margin:12px}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pc{overflow:hidden;border:1px solid var(--l);border-radius:16px;background:var(--c2)}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:#182132}.ph{display:flex;align-items:center;justify-content:center;font-size:45px}.pb{padding:13px}.pn{font-size:18px;font-weight:900}.pc button{width:100%;margin-top:10px}.row{padding:13px 0;border-bottom:1px solid var(--l);display:flex;gap:10px;align-items:center}.row img,.av{width:62px;height:62px;border-radius:12px;object-fit:cover;background:#182132}.ri{flex:1}.sel{border-left:4px solid #22c55e;padding-left:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#9f111b}.bar{height:8px;background:#283246;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--r),var(--b))}@media(max-width:560px){
.grid{grid-template-columns:1fr}
.players{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{padding:12px}
.photo{aspect-ratio:1/1}
.pb{padding:9px}
.pn{font-size:14px;line-height:1.15}
.pc button{padding:10px 6px;font-size:13px}
}
</style></head><body><div class="wrap"><header><img src="logo.png" class="logo"><h1>IGRAČ UTAKMICE</h1><div class="muted">NK Zrinski Nova Bukovica</div><div class="nav"><button id="pubB" class="active">GLASANJE</button><button id="admB">ADMIN</button></div></header>
<section id="pub"><div class="card"><div id="mt" class="title">Učitavanje...</div><div id="mi" class="center muted"></div><div id="vs" class="status wait">UČITAVANJE</div><div id="tl" class="center muted"></div><div id="tm" class="timer">--:--:--</div><div id="msg" class="notice"></div><div id="plist" class="players"></div><div id="results" class="hidden"></div></div></section>
<section id="login" class="card hidden"><h2>Admin prijava</h2><label>Email</label><input id="email" type="email"><label>Lozinka</label><input id="pass" type="password"><button id="loginB">PRIJAVI SE</button><div id="loginM"></div></section>
<section id="admin" class="hidden"><div class="card"><h2>Nova utakmica</h2><div class="grid"><div><label>Domaći</label><input id="home" value="NK Zrinski"></div><div><label>Gosti</label><input id="away"></div></div><label>Datum</label><input id="date" type="date"><div class="grid"><div><label>Otvaranje</label><input id="op" type="datetime-local"></div><div><label>Zatvaranje</label><input id="cl" type="datetime-local"></div></div><label>Status</label><select id="st"><option value="published">Objavljeno</option><option value="draft">Nacrt</option></select><button id="saveB">SPREMI UTAKMICU</button><div id="am"></div></div>
<div class="card"><h2>Stalni roster</h2><div class="grid"><div><label>Ime i prezime</label><input id="name"></div><div><label>Broj</label><input id="num" type="number"></div></div><label>URL fotografije (opcionalno)</label><input id="photo"><button id="addB">DODAJ U ROSTER</button><div id="roster"></div></div>
<div class="card"><h2>Utakmice</h2><div id="matches"></div></div><div id="manage" class="card hidden"><h2>Odaberi igrače</h2><div id="sm" class="muted"></div><div class="notice">Klikni UKLJUČI za igrače koji igraju ovu utakmicu.</div><div id="mr"></div>
<div style="margin-top:18px">
  <div class="actions" style="justify-content:space-between;align-items:center">
    <h2 style="margin:0">Rezultati uživo</h2>
    <button id="refreshResults" class="gray">OSVJEŽI</button>
  </div>
  <div class="muted" style="margin:6px 0 10px">Vidljivo samo administratoru.</div>
  <div id="adminResults" class="notice">Odaberi utakmicu za prikaz rezultata.</div>
</div>
</div><div class="card"><button id="logout" class="gray">ODJAVA</button></div></section></div>
<script>
const sb=supabase.createClient("https://srfniisyvjohlrngpnee.supabase.co","sb_publishable_jBq7SSHdgejzCAJv3jhreQ_CCUK6Lhs"),$=x=>document.getElementById(x);let selected=null,timer=null;const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function tok(){let t=localStorage.getItem("zrinski_device_token");if(!t){t=crypto.randomUUID();localStorage.setItem("zrinski_device_token",t)}return t}function ft(ms){let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return[h,m,s].map(x=>String(x).padStart(2,"0")).join(":")}function tick(target,label){clearInterval(timer);let f=()=>{let d=target-Date.now();$("tl").textContent=label;if(d<=0){clearInterval(timer);loadPublic()}else $("tm").textContent=ft(d)};f();timer=setInterval(f,1000)}
async function findMatch(){let q=new URLSearchParams(location.search).get("match");if(q)return q;let r=await sb.from("matches").select("*").eq("status","published").order("match_date",{ascending:false});if(!r.data?.length)return null;let n=Date.now(),a=r.data.find(x=>n>=new Date(x.voting_opens_at)&&n<new Date(x.voting_closes_at));if(a)return a.id;return r.data.filter(x=>new Date(x.voting_opens_at)>n).sort((a,b)=>new Date(a.voting_opens_at)-new Date(b.voting_opens_at))[0]?.id||null}
async function loadPublic(){clearInterval(timer);let id=await findMatch();if(!id){$("mt").textContent="Nema aktivnog glasanja";$("vs").className="status closed";$("vs").textContent="NEMA GLASANJA";$("msg").textContent="Trenutno nema objavljene utakmice.";$("plist").innerHTML="";return}let r=await sb.from("matches").select("*").eq("id",id).maybeSingle();if(r.error||!r.data)return;selected=r.data;$("mt").textContent=r.data.home_team+" — "+r.data.away_team;$("mi").textContent=new Date(r.data.match_date+"T12:00:00").toLocaleDateString("hr-HR");let n=Date.now(),o=new Date(r.data.voting_opens_at).getTime(),c=new Date(r.data.voting_closes_at).getTime(),s=n<o?"wait":n<c?"open":"closed";$("vs").className="status "+s;$("vs").textContent=s==="open"?"GLASANJE OTVORENO":s==="wait"?"GLASANJE JOŠ NIJE OTVORENO":"GLASANJE ZATVORENO";if(s==="wait")tick(o,"OTVARA SE ZA");else if(s==="open")tick(c,"ZATVARA SE ZA");else{$("tl").textContent="GLASANJE ZAVRŠENO";$("tm").textContent="00:00:00"}let voted=localStorage.getItem("voted_"+id)==="1";$("msg").textContent=voted?"Vaš glas je već zabilježen.":s==="open"?"Odaberite igrača utakmice.":"Glasanje trenutno nije otvoreno.";let p=await sb.from("match_players").select("player_id,players(id,name,shirt_number,photo_url)").eq("match_id",id),rows=(p.data||[]).map(x=>x.players).filter(Boolean);$("plist").innerHTML=rows.length?rows.map(x=>`<div class="pc">${x.photo_url?`<img class="photo" src="${e(x.photo_url)}">`:`<div class="photo ph">⚽</div>`}<div class="pb"><div class="muted">BROJ ${e(x.shirt_number??"—")}</div><div class="pn">${e(x.name)}</div><button data-v="${x.id}" ${s!=="open"||voted?"disabled":""}>${voted?"GLAS ZABILJEŽEN":"GLASAJ"}</button></div></div>`).join(""):'<div class="notice">Igrači još nisu odabrani.</div>';document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>vote(b.dataset.v));if(s==="closed"&&Date.now()<c+86400000)results(id);else $("results").classList.add("hidden")}
async function vote(pid){let r=await sb.rpc("submit_vote",{p_match_id:selected.id,p_player_id:pid,p_device_hash:tok()});if(r.error)return alert(r.error.message);if(r.data?.success){localStorage.setItem("voted_"+selected.id,"1");alert("Hvala! Glas je zabilježen.");loadPublic()}else alert(r.data?.message||"Greška")}
async function results(id){let r=await sb.rpc("get_match_results",{p_match_id:id});if(r.error)return;let a=r.data||[],t=a.reduce((s,x)=>s+Number(x.vote_count||0),0);$("results").classList.remove("hidden");$("results").innerHTML="<h2>REZULTATI</h2>"+a.map(x=>{let v=Number(x.vote_count||0),p=t?Math.round(v*100/t):0;return`<div class="row"><div class="ri"><b>${e(x.player_name)}</b><div class="bar"><div class="fill" style="width:${p}%"></div></div></div><b>${v} (${p}%)</b></div>`}).join("")}
async function roster(){let r=await sb.from("players").select("*").order("shirt_number");$("roster").innerHTML=(r.data||[]).map(x=>`<div class="row">${x.photo_url?`<img src="${e(x.photo_url)}">`:`<div class="av"></div>`}<div class="ri"><b>#${e(x.shirt_number??"—")} ${e(x.name)}</b></div><button class="danger" data-d="${x.id}">OBRIŠI</button></div>`).join("")||'<div class="notice">Roster je prazan.</div>';document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>delPlayer(b.dataset.d))}
async function addPlayer(){let n=$("name").value.trim();if(!n)return alert("Unesi ime.");let r=await sb.from("players").insert({name:n,shirt_number:Number($("num").value)||null,photo_url:$("photo").value.trim()||null,active:true});if(r.error)return alert(r.error.message);$("name").value=$("num").value=$("photo").value="";roster();if(selected)manage(selected.id)}
async function delPlayer(id){if(!confirm("Obrisati igrača?"))return;let r=await sb.from("players").delete().eq("id",id);if(r.error)return alert(r.error.message);roster()}
async function matches(){let r=await sb.from("matches").select("*").order("match_date",{ascending:false});$("matches").innerHTML=(r.data||[]).map(x=>`<div class="row"><div class="ri"><b>${e(x.home_team)} — ${e(x.away_team)}</b><div class="muted">${e(x.match_date)} • ${e(x.status)}</div></div><button class="blue" data-m="${x.id}">ODABERI IGRAČE</button></div>`).join("")||'<div class="notice">Nema utakmica.</div>';document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>manage(b.dataset.m))}
async function save(){let h=$("home").value.trim(),a=$("away").value.trim(),d=$("date").value,o=$("op").value,c=$("cl").value;if(!h||!a||!d||!o||!c)return $("am").textContent="Popuni sva polja.";let r=await sb.from("matches").insert({home_team:h,away_team:a,match_date:d,voting_opens_at:new Date(o).toISOString(),voting_closes_at:new Date(c).toISOString(),status:$("st").value,show_results_after_close:true}).select().single();if(r.error)return $("am").textContent=r.error.message;$("am").textContent="Utakmica spremljena.";matches();manage(r.data.id)}

async function adminLiveResults(id){
  let r=await sb.rpc("get_match_results",{p_match_id:id});
  if(r.error){
    $("adminResults").innerHTML='<div>Greška pri učitavanju rezultata: '+e(r.error.message)+'</div>';
    return;
  }
  let rows=r.data||[], total=rows.reduce((s,x)=>s+Number(x.vote_count||0),0);
  if(!rows.length){
    $("adminResults").innerHTML="Još nema odabranih igrača ili rezultata.";
    return;
  }
  let max=Math.max(...rows.map(x=>Number(x.vote_count||0)));
  let leaders=rows.filter(x=>Number(x.vote_count||0)===max && max>0).map(x=>x.player_name);
  let leadText=max>0
    ? (leaders.length===1 ? "Trenutno vodi: "+e(leaders[0])+" ("+max+" glas"+(max===1?"":"ova")+")"
                         : "Trenutno izjednačeno: "+leaders.map(e).join(", ")+" ("+max+" glasova)")
    : "Još nema glasova.";
  $("adminResults").innerHTML=
    '<div style="margin-bottom:10px"><b>'+leadText+'</b><br><span class="muted">Ukupno glasova: '+total+'</span></div>'+
    rows.map((x,i)=>{
      let v=Number(x.vote_count||0), p=total?Math.round(v*100/total):0;
      return '<div class="row"><div class="ri"><b>'+(i+1)+'. #'+e(x.shirt_number??"—")+' '+e(x.player_name)+'</b>'+
             '<div class="bar" style="margin-top:7px"><div class="fill" style="width:'+p+'%"></div></div></div>'+
             '<b>'+v+' ('+p+'%)</b></div>';
    }).join("");
}

async function manage(id){let m=await sb.from("matches").select("*").eq("id",id).single();if(m.error)return alert(m.error.message);selected=m.data;$("manage").classList.remove("hidden");$("sm").textContent=m.data.home_team+" — "+m.data.away_team+" | "+m.data.match_date;let [p,q]=await Promise.all([sb.from("players").select("*").eq("active",true).order("shirt_number"),sb.from("match_players").select("player_id").eq("match_id",id)]),on=new Set((q.data||[]).map(x=>x.player_id));$("mr").innerHTML=(p.data||[]).map(x=>`<div class="row ${on.has(x.id)?"sel":""}"><div class="ri"><b>#${e(x.shirt_number??"—")} ${e(x.name)}</b><div class="muted">${on.has(x.id)?"✓ U GLASANJU":"NIJE ODABRAN"}</div></div><button class="${on.has(x.id)?"gray":"blue"}" data-t="${x.id}">${on.has(x.id)?"ISKLJUČI":"UKLJUČI"}</button></div>`).join("");document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>toggle(id,b.dataset.t,on.has(b.dataset.t)));await adminLiveResults(id)}
async function toggle(mid,pid,on){let r=on?await sb.from("match_players").delete().eq("match_id",mid).eq("player_id",pid):await sb.from("match_players").insert({match_id:mid,player_id:pid});if(r.error)return alert(r.error.message);manage(mid)}
async function adminMode(){$("pub").classList.add("hidden");$("pubB").classList.remove("active");$("admB").classList.add("active");let s=await sb.auth.getSession();if(s.data.session){$("login").classList.add("hidden");$("admin").classList.remove("hidden");matches();roster()}else{$("login").classList.remove("hidden");$("admin").classList.add("hidden")}}
function publicMode(){$("pub").classList.remove("hidden");$("login").classList.add("hidden");$("admin").classList.add("hidden");$("pubB").classList.add("active");$("admB").classList.remove("active");loadPublic()}
$("pubB").onclick=publicMode;$("admB").onclick=adminMode;$("loginB").onclick=async()=>{let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(r.error)return $("loginM").textContent=r.error.message;adminMode()};$("saveB").onclick=save;$("addB").onclick=addPlayer;$("refreshResults").onclick=()=>{if(selected)adminLiveResults(selected.id)};$("logout").onclick=async()=>{await sb.auth.signOut();publicMode()};publicMode();
</script></body></html>
