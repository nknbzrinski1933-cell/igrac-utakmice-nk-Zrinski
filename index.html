<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NK Zrinski - Igrač utakmice</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
    --red:#e30613;
    --blue:#1238e8;
    --dark:#070a12;
    --card:#111827;
    --line:#273247;
    --muted:#aab4c5;
    --white:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top right,#142b8a55,transparent 35%),
        linear-gradient(145deg,#05070d,#111827);
    color:var(--white);
}

button,
input,
select{
    font:inherit;
}

button{
    border:0;
    border-radius:11px;
    padding:12px 16px;
    font-weight:800;
    cursor:pointer;
    color:white;
    background:var(--red);
}

button:hover{
    filter:brightness(1.08);
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:20px 15px 50px;
}

/* HEADER */

.header{
    text-align:center;
    padding:10px 0 5px;
}

.logo{
    width:105px;
    height:105px;
    object-fit:contain;
    background:white;
    border-radius:24px;
    padding:5px;
    box-shadow:0 0 35px #1238e855;
}

.header h1{
    margin:12px 0 3px;
    font-size:30px;
}

.header-sub{
    color:var(--muted);
    font-size:14px;
}

.nav{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-top:14px;
}

.nav button{
    background:#202a3d;
}

.nav button.active{
    background:var(--blue);
}

/* CARDS */

.card{
    background:rgba(17,24,39,.96);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-top:16px;
    box-shadow:0 15px 40px #0006;
}

.card h2{
    margin-top:0;
}

/* MATCH */

.match-title{
    font-size:28px;
    font-weight:900;
    text-align:center;
}

.match-info{
    text-align:center;
    color:var(--muted);
    margin-top:6px;
}

/* STATUS */

.status{
    text-align:center;
    font-weight:900;
    padding:12px;
    border-radius:12px;
    margin-top:18px;
}

.status.open{
    background:#087a3d;
}

.status.wait{
    background:#705900;
}

.status.closed{
    background:#7a2029;
}

/* TIMER */

.timer{
    text-align:center;
    margin:20px 0;
}

.timer-label{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.timer-value{
    font-size:42px;
    font-weight:900;
    margin-top:5px;
    letter-spacing:2px;
}

/* NOTICE */

.notice{
    padding:12px;
    border-radius:10px;
    background:#182132;
    color:#d9e0ec;
    margin-top:10px;
}

/* PLAYERS */

.player{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:15px;
    margin:10px 0;
    border:1px solid var(--line);
    border-radius:15px;
    background:#0b111d;
}

.player-name{
    font-size:18px;
    font-weight:800;
}

.player-number{
    color:var(--muted);
    font-size:12px;
    margin-bottom:4px;
}

.player button{
    min-width:100px;
}

/* RESULTS */

.result-row{
    padding:12px 0;
    border-bottom:1px solid var(--line);
}

.bar{
    height:8px;
    background:#283246;
    border-radius:9px;
    overflow:hidden;
    margin-top:7px;
}

.fill{
    height:100%;
    background:linear-gradient(90deg,var(--red),var(--blue));
}

/* FORMS */

label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
}

input,
select{
    width:100%;
    padding:12px;
    margin:6px 0 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#090e18;
    color:white;
}

input:focus,
select:focus{
    outline:2px solid #1238e866;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* ADMIN */

.admin-match{
    padding:13px 0;
    border-bottom:1px solid var(--line);
}

.admin-match:last-child{
    border-bottom:0;
}

.admin-actions{
    margin-top:9px;
}

/* HELPERS */

.hidden{
    display:none !important;
}

.small{
    color:var(--muted);
    font-size:12px;
}

.red-button{
    background:#9e0710;
}

.blue-button{
    background:var(--blue);
}

.gray-button{
    background:#273247;
}

/* MOBILE */

@media(max-width:520px){

    .container{
        padding:15px 12px 40px;
    }

    .logo{
        width:90px;
        height:90px;
    }

    .header h1{
        font-size:25px;
    }

    .match-title{
        font-size:23px;
    }

    .timer-value{
        font-size:32px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .player{
        flex-direction:column;
        align-items:stretch;
    }

    .player button{
        width:100%;
    }
}
</style>
</head>

<body>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://srfniisyvjohlrngpnee.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jBq7SSHdgejzCAJv3jhreQ_CCUK6Lhs";

const sb =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBALNE VARIJABLE
===================================================== */

let selectedMatch = null;

let timerInterval = null;


/* =====================================================
   POMOĆNE FUNKCIJE
===================================================== */

function $(id){

    return document.getElementById(id);

}


function esc(value){

    return String(value ?? "")
        .replace(/[&<>"']/g, function(char){

            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        });

}


/* =====================================================
   ID UTAKMICE IZ LINKA
===================================================== */

function matchId(){

    return new URLSearchParams(
        window.location.search
    ).get("match");

}


/* =====================================================
   IDENTIFIKACIJA UREĐAJA
===================================================== */

function deviceToken(){

    let token =
        localStorage.getItem(
            "zrinski_device_token"
        );


    if(!token){

        if(
            window.crypto &&
            crypto.randomUUID
        ){

            token =
                crypto.randomUUID();

        }else{

            token =
                Math.random()
                .toString(36)
                .substring(2)
                +
                Date.now();

        }


        localStorage.setItem(
            "zrinski_device_token",
            token
        );

    }


    return token;

}


/* =====================================================
   PRONAĐI AKTIVNU UTAKMICU
===================================================== */

async function findActiveMatch(){

    /*
        Ako link ima:

        ?match=ID

        koristi baš tu utakmicu.
    */

    const direct =
        matchId();


    if(direct){

        return direct;

    }


    /*
        Ako nema ?match=ID,
        tražimo objavljene utakmice.
    */

    const result =
        await sb
        .from("matches")
        .select(
            "id,voting_opens_at,voting_closes_at,match_date"
        )
        .eq(
            "status",
            "published"
        )
        .order(
            "match_date",
            {
                ascending:false
            }
        );


    if(
        result.error ||
        !result.data ||
        result.data.length === 0
    ){

        return null;

    }


    const now =
        Date.now();


    /*
        Prvo tražimo trenutno
        otvoreno glasanje.
    */

    const active =
        result.data.find(function(match){

            const open =
                new Date(
                    match.voting_opens_at
                ).getTime();


            const close =
                new Date(
                    match.voting_closes_at
                ).getTime();


            return (
                now >= open &&
                now < close
            );

        });


    if(active){

        return active.id;

    }


    /*
        Ako nema aktivnog,
        pronađi sljedeće glasanje.
    */

    const next =
        result.data
        .filter(function(match){

            return (
                new Date(
                    match.voting_opens_at
                ).getTime()
                > now
            );

        })
        .sort(function(a,b){

            return (
                new Date(a.voting_opens_at)
                -
                new Date(b.voting_opens_at)
            );

        })[0];


    return next
        ? next.id
        : null;

}


/* =====================================================
   FORMAT TIMERA
===================================================== */

function formatTime(milliseconds){

    let seconds =
        Math.max(
            0,
            Math.floor(
                milliseconds / 1000
            )
        );


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds %= 3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds %= 60;


    return (
        String(hours).padStart(2,"0")
        +
        ":"
        +
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(seconds).padStart(2,"0")
    );

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(
    openTime,
    closeTime,
    state
){

    clearInterval(
        timerInterval
    );


    function update(){

        const now =
            Date.now();


        let remaining;


        if(state === "wait"){

            remaining =
                openTime - now;


            $("timerLabel").textContent =
                "GLASANJE SE OTVARA ZA";

        }else{

            remaining =
                closeTime - now;


            $("timerLabel").textContent =
                "GLASANJE SE ZATVARA ZA";

        }


        if(remaining <= 0){

            clearInterval(
                timerInterval
            );


            loadPublic();

            return;

        }


        $("timer").textContent =
            formatTime(
                remaining
            );

    }


    update();


    timerInterval =
        setInterval(
            update,
            1000
        );

}


/* =====================================================
   JAVNI DIO
===================================================== */

async function loadPublic(){

    const id =
        await findActiveMatch();


    if(!id){

        $("matchTitle").textContent =
            "Nema aktivnog glasanja";


        $("matchInfo").textContent =
            "Trenutno nema objavljene utakmice.";


        $("voteStatus").className =
            "status closed";


        $("voteStatus").textContent =
            "NEMA GLASANJA";


        $("voteMessage").textContent =
            "Admin još nije otvorio glasanje.";


        $("timer").textContent =
            "--:--:--";


        $("players").innerHTML =
            "";


        return;

    }


    const matchResult =
        await sb
        .from("matches")
        .select("*")
        .eq("id",id)
        .eq("status","published")
        .maybeSingle();


    if(
        matchResult.error ||
        !matchResult.data
    ){

        $("matchTitle").textContent =
            "Utakmica nije pronađena";


        $("matchInfo").textContent =
            "Provjeri poveznicu.";


        $("players").innerHTML =
            "";


        return;

    }


    selectedMatch =
        matchResult.data;


    $("matchTitle").textContent =
        matchResult.data.home_team
        +
        " — "
        +
        matchResult.data.away_team;


    $("matchInfo").textContent =
        "Datum: "
        +
        new Date(
            matchResult.data.match_date
            +
            "T12:00:00"
        ).toLocaleDateString(
            "hr-HR"
        );


    const now =
        Date.now();


    const openTime =
        new Date(
            matchResult.data.voting_opens_at
        ).getTime();


    const closeTime =
        new Date(
            matchResult.data.voting_closes_at
        ).getTime();


    let state;


    if(now < openTime){

        state = "wait";

    }else if(now >= closeTime){

        state = "closed";

    }else{

        state = "open";

    }


    /* STATUS */

    $("voteStatus").className =
        "status "
        +
        state;


    if(state === "open"){

        $("voteStatus").textContent =
            "GLASANJE OTVORENO";


        $("voteMessage").textContent =
            "Odaberi jednog igrača. Svaki uređaj može glasati jednom.";

    }


    if(state === "wait"){

        $("voteStatus").textContent =
            "GLASANJE JOŠ NIJE OTVORENO";


        $("voteMessage").textContent =
            "Glasanje će se automatski otvoriti u zadano vrijeme.";

    }


    if(state === "closed"){

        $("voteStatus").textContent =
            "GLASANJE ZATVORENO";


        $("voteMessage").textContent =
            "Glasanje je završeno.";

    }


    /* TIMER */

    if(state !== "closed"){

        startTimer(
            openTime,
            closeTime,
            state
        );

    }else{

        clearInterval(
            timerInterval
        );


        $("timerLabel").textContent =
            "GLASANJE JE ZATVORENO";


        $("timer").textContent =
            "00:00:00";

    }


    /* IGRAČI */

    const playersResult =
        await sb
        .from("players")
        .select("*")
        .eq(
            "match_id",
            id
        )
        .order(
            "shirt_number",
            {
                ascending:true
            }
        );


    if(playersResult.error){

        $("players").innerHTML =
            "<div class='notice'>Greška pri učitavanju igrača.</div>";


        return;

    }


    const alreadyVoted =
        localStorage.getItem(
            "voted_" + id
        ) === "1";


    if(
        !playersResult.data ||
        playersResult.data.length === 0
    ){

        $("players").innerHTML =
            "<div class='notice'>Igrači još nisu uneseni.</div>";


    }else{

        $("players").innerHTML =
            playersResult.data
            .map(function(player){

                const disabled =
                    state !== "open"
                    ||
                    alreadyVoted;


                const buttonText =
                    alreadyVoted
                    ?
                    "GLAS VEĆ ZABILJEŽEN"
                    :
                    "GLASAJ";


                return `

                <div class="player">

                    <div>

                        <div class="player-number">
                            BROJ ${esc(
                                player.shirt_number || "—"
                            )}
                        </div>

                        <div class="player-name">
                            ${esc(player.name)}
                        </div>

                    </div>

                    <button
                        data-player="${player.id}"
                        ${disabled ? "disabled" : ""}
                    >
                        ${buttonText}
                    </button>

                </div>

                `;

            })
            .join("");


        document
        .querySelectorAll(
            "[data-player]"
        )
        .forEach(function(button){

            button.addEventListener(
                "click",
                function(){

                    vote(
                        button.dataset.player
                    );

                }
            );

        });

    }


    /* REZULTATI */

    if(
        state === "closed"
        &&
        matchResult.data.show_results_after_close
    ){

        await loadResults(id);

    }else{

        $("results").classList.add(
            "hidden"
        );

    }

}


/* =====================================================
   GLASANJE
===================================================== */

async function vote(
    playerId
){

    if(!selectedMatch){

        return;

    }


    const result =
        await sb.rpc(
            "submit_vote",
            {
                p_match_id:
                    selectedMatch.id,

                p_player_id:
                    playerId,

                p_device_hash:
                    deviceToken()
            }
        );


    if(result.error){

        alert(
            "Greška pri slanju glasa: "
            +
            result.error.message
        );


        return;

    }


    if(
        result.data &&
        result.data.success
    ){

        localStorage.setItem(
            "voted_" +
            selectedMatch.id,
            "1"
        );


        alert(
            "Hvala! Vaš glas je zabilježen."
        );


        await loadPublic();


    }else{

        alert(
            result.data &&
            result.data.message
            ?
            result.data.message
            :
            "Glas nije zaprimljen."
        );

    }

}


/* =====================================================
   REZULTATI
===================================================== */

async function loadResults(
    id
){

    const result =
        await sb.rpc(
            "get_match_results",
            {
                p_match_id:id
            }
        );


    if(result.error){

        return;

    }


    const rows =
        result.data || [];


    const total =
        rows.reduce(
            function(sum,row){

                return (
                    sum
                    +
                    Number(
                        row.vote_count
                    )
                );

            },
            0
        );


    $("results").classList.remove(
        "hidden"
    );


    let html =
        "<h2>Rezultati</h2>";


    rows.forEach(function(row){

        const percentage =
            total
            ?
            Math.round(
                Number(
                    row.vote_count
                )
                *
                100
                /
                total
            )
            :
            0;


        html += `

        <div class="result-row">

            <b>
                ${esc(row.player_name)}
            </b>

            —
            ${row.vote_count}
            glasova
            (${percentage}%)

            <div class="bar">

                <div
                    class="fill"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>

        `;

    });


    html += `

        <p class="small">
            Ukupno glasova: ${total}
        </p>

    `;


    $("results").innerHTML =
        html;

}


/* =====================================================
   ADMIN — UTAKMICE
===================================================== */

async function loadMatches(){

    const result =
        await sb
        .from("matches")
        .select("*")
        .order(
            "match_date",
            {
                ascending:false
            }
        );


    if(result.error){

        $("matchList").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    if(
        !result.data ||
        result.data.length === 0
    ){

        $("matchList").innerHTML =
            "<div class='notice'>Nema utakmica.</div>";


        return;

    }


    $("matchList").innerHTML =
        result.data
        .map(function(match){

            return `

            <div class="admin-match">

                <b>
                    ${esc(match.home_team)}
                    —
                    ${esc(match.away_team)}
                </b>

                <br>

                <span class="small">

                    ${esc(match.match_date)}
                    •
                    ${esc(match.status)}

                </span>

                <div class="admin-actions">

                    <button
                        data-manage="${match.id}"
                        class="blue-button"
                    >
                        UPRAVLJAJ IGRAČIMA
                    </button>

                </div>

            </div>

            `;

        })
        .join("");


    document
    .querySelectorAll(
        "[data-manage]"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                manageMatch(
                    button.dataset.manage
                );

            }
        );

    });

}


/* =====================================================
   ADMIN — SPREMI UTAKMICU
===================================================== */

async function saveMatch(){

    const home =
        $("homeTeam")
        .value
        .trim();


    const away =
        $("awayTeam")
        .value
        .trim();


    const date =
        $("matchDate")
        .value;


    const open =
        $("openTime")
        .value;


    const close =
        $("closeTime")
        .value;


    if(
        !home ||
        !away ||
        !date ||
        !open ||
        !close
    ){

        $("adminMessage").textContent =
            "Popuni sva polja.";


        return;

    }


    if(
        new Date(close)
        <=
        new Date(open)
    ){

        $("adminMessage").textContent =
            "Vrijeme zatvaranja mora biti nakon otvaranja.";


        return;

    }


    const result =
        await sb
        .from("matches")
        .insert({

            home_team:
                home,

            away_team:
                away,

            match_date:
                date,

            voting_opens_at:
                new Date(open)
                .toISOString(),

            voting_closes_at:
                new Date(close)
                .toISOString(),

            status:
                $("matchStatus").value,

            show_results_after_close:
                $("resultsAfter").checked

        })
        .select()
        .single();


    if(result.error){

        $("adminMessage").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    $("adminMessage").textContent =
        "Utakmica uspješno spremljena.";


    await loadMatches();


    await manageMatch(
        result.data.id
    );

}


/* =====================================================
   ADMIN — UPRAVLJANJE IGRAČIMA
===================================================== */

async function manageMatch(
    id
){

    const result =
        await sb
        .from("matches")
        .select("*")
        .eq(
            "id",
            id
        )
        .single();


    if(result.error){

        alert(
            result.error.message
        );


        return;

    }


    selectedMatch =
        result.data;


    $("manageView")
        .classList
        .remove("hidden");


    $("selectedMatch").textContent =
        result.data.home_team
        +
        " — "
        +
        result.data.away_team
        +
        " | "
        +
        result.data.match_date;


    const playersResult =
        await sb
        .from("players")
        .select("*")
        .eq(
            "match_id",
            id
        )
        .order(
            "shirt_number",
            {
                ascending:true
            }
        );


    if(
        !playersResult.data ||
        playersResult.data.length === 0
    ){

        $("playerList").innerHTML =
            "<div class='notice'>Nema igrača.</div>";


        return;

    }


    $("playerList").innerHTML =
        playersResult.data
        .map(function(player){

            return `

            <div class="admin-match">

                <b>
                    #
                    ${esc(
                        player.shirt_number || "—"
                    )}

                    ${esc(
                        player.name
                    )}
                </b>

                <button
                    class="red-button"
                    data-delete="${player.id}"
                >
                    OBRIŠI
                </button>

            </div>

            `;

        })
        .join("");


    document
    .querySelectorAll(
        "[data-delete]"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                deletePlayer(
                    button.dataset.delete,
                    id
                );

            }
        );

    });

}


/* =====================================================
   ADMIN — DODAJ IGRAČA
===================================================== */

async function addPlayer(){

    if(!selectedMatch){

        return;

    }


    const name =
        $("playerName")
        .value
        .trim();


    const number =
        Number(
            $("playerNumber")
            .value
        )
        ||
        null;


    if(!name){

        alert(
            "Unesi ime igrača."
        );


        return;

    }


    const result =
        await sb
        .from("players")
        .insert({

            match_id:
                selectedMatch.id,

            name:
                name,

            shirt_number:
                number

        });


    if(result.error){

        alert(
            "Greška: "
            +
            result.error.message
        );


        return;

    }


    $("playerName").value =
        "";


    $("playerNumber").value =
        "";


    await manageMatch(
        selectedMatch.id
    );

}


/* =====================================================
   ADMIN — OBRIŠI IGRAČA
===================================================== */

async function deletePlayer(
    playerId,
    matchId
){

    if(
        !confirm(
            "Želiš li obrisati ovog igrača?"
        )
    ){

        return;

    }


    const result =
        await sb
        .from("players")
        .delete()
        .eq(
            "id",
            playerId
        );


    if(result.error){

        alert(
            result.error.message
        );


        return;

    }


    await manageMatch(
        matchId
    );

}


/* =====================================================
   PRIKAZ JAVNOG DIJELA
===================================================== */

function publicMode(){

    $("publicView")
        .classList
        .remove("hidden");


    $("loginView")
        .classList
        .add("hidden");


    $("adminView")
        .classList
        .add("hidden");


    $("publicBtn")
        .classList
        .add("active");


    $("adminBtn")
        .classList
        .remove("active");


    loadPublic();

}


/* =====================================================
   ADMIN MODE
===================================================== */

async function adminMode(){

    $("publicView")
        .classList
        .add("hidden");


    $("publicBtn")
        .classList
        .remove("active");


    $("adminBtn")
        .classList
        .add("active");


    const sessionResult =
        await sb.auth.getSession();


    if(
        sessionResult.data.session
    ){

        $("loginView")
            .classList
            .add("hidden");


        $("adminView")
            .classList
            .remove("hidden");


        loadMatches();


    }else{

        $("loginView")
            .classList
            .remove("hidden");


        $("adminView")
            .classList
            .add("hidden");

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

    const email =
        $("email")
        .value
        .trim();


    const password =
        $("password")
        .value;


    const result =
        await sb.auth.signInWithPassword({

            email:
                email,

            password:
                password

        });


    if(result.error){

        $("loginMessage").textContent =
            "Greška: "
            +
            result.error.message;


        return;

    }


    $("loginMessage").textContent =
        "";


    $("loginView")
        .classList
        .add("hidden");


    $("adminView")
        .classList
        .remove("hidden");


    await loadMatches();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

    await sb.auth.signOut();


    publicMode();

}


/* =====================================================
   EVENT LISTENERS
===================================================== */

$("publicBtn")
    .addEventListener(
        "click",
        publicMode
    );


$("adminBtn")
    .addEventListener(
        "click",
        adminMode
    );


$("loginBtn")
    .addEventListener(
        "click",
        login
    );


$("logoutBtn")
    .addEventListener(
        "click",
        logout
    );


$("saveMatchBtn")
    .addEventListener(
        "click",
        saveMatch
    );


$("addPlayerBtn")
    .addEventListener(
        "click",
        addPlayer
    );


/* =====================================================
   START
===================================================== */

publicMode();

</script>

</body>
 </html>
